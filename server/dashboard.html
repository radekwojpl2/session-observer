<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Observer</title>
<!-- the app icon (docs/brand/src/icon-eye.svg): an eye whose iris is the context-usage gauge; also drawn in the header below -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231c2d4d'/%3E%3Cstop offset='1' stop-color='%230e0f11'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M7 32C14 20 22 15 32 15s18 5 25 17c-7 12-15 17-25 17S14 44 7 32z' fill='none' stroke='%23e6e7ea' stroke-width='3.5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%232d3036' stroke-width='4.5'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%2322d3ee' stroke-width='4.5' stroke-linecap='round' stroke-dasharray='40 62.8' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fb923c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dashboard/dashboard.css">
</head>
<body>
<header class="topbar">
  <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2d4d"/><stop offset="1" stop-color="#0e0f11"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#logoGrad)"/><path d="M7 32C14 20 22 15 32 15s18 5 25 17c-7 12-15 17-25 17S14 44 7 32z" fill="none" stroke="#e6e7ea" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="32" r="10" fill="none" stroke="#2d3036" stroke-width="4.5"/><circle cx="32" cy="32" r="10" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="40 62.8" transform="rotate(-90 32 32)"/><circle cx="32" cy="32" r="4" fill="#fb923c"/></svg>Session Observer<a class="ver" id="ver" target="_blank" rel="noopener noreferrer" data-t-title="verTitle" title="Version of the running server. It keeps running after a plugin update until it is restarted, so an older number here means an old server."></a></h1>
  <span class="pill" data-t-title="connTitle" title="Live connection to the local server"><span class="dot" id="conn"></span><span id="connTxt" data-t="connecting">connecting…</span></span>
  <span class="grow"></span>
  <span class="pill" id="hdrBusy" data-t-title="busyTitle" title="Sessions currently in the middle of a turn"></span>
  <button id="pause" data-t-title="freezeTitle" title="Freeze the screen; new events are buffered and applied when you resume">Freeze</button>
  <button id="keysHelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts (?)">?</button>
  <!-- the settings: theme, notifications, language, and Clear log apart at the bottom -->
  <details class="hmenu" id="settings">
    <summary><span aria-hidden="true">⚙</span> <span data-t="settings">Settings</span></summary>
    <div class="hmenu-box panel">
      <button id="theme">Theme: auto</button>
      <select id="notify"></select>
      <label class="hmenu-row"><span data-t="language">Language</span><select id="lang" data-t-title="language" data-t-aria="language" title="Language" aria-label="Language"></select></label>
      <a class="hmenu-link" id="reportIssue" target="_blank" rel="noopener noreferrer"><span data-t="reportIssue">Report an issue</span> <span aria-hidden="true">↗</span></a>
      <hr>
      <button id="clearLog" data-t-title="clearLogTitle" title="Delete the local event log" data-t="clearLog">Clear log</button>
    </div>
  </details>
  <!-- the project on GitHub (the mark is GitHub's logo, drawn inline: the page loads nothing from outside) -->
  <a class="hbtn" id="repoLink" target="_blank" rel="noopener noreferrer" data-t-title="githubTitle" data-t-aria="githubTitle" title="Session Observer on GitHub" aria-label="Session Observer on GitHub"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
</header>

<section class="panel filters" id="filters">
  <label><span data-t="range">Range</span>
    <select id="range">
      <option value="3600000" data-t="range1h">last 1 h</option>
      <option value="21600000" data-t="range6h">last 6 h</option>
      <option value="86400000" data-t="range24h">last 24 h</option>
      <option value="604800000" data-t="range7d">last 7 d</option>
      <option value="0" data-t="rangeAll">everything</option>
    </select>
  </label>
  <!-- how the sessions list is ordered: all but "last activity" keep it still while sessions work -->
  <label data-t-title="sessionOrderTitle" title="How the sessions list is ordered. Only &quot;last activity&quot; reshuffles it while sessions work."><span data-t="sessionOrder">Order</span>
    <select id="sessionOrder">
      <option value="started" data-t="orderStarted">newest started</option>
      <option value="activity" data-t="orderActivity">last activity</option>
      <option value="name" data-t="orderName">name</option>
      <option value="project" data-t="orderProject">project</option>
    </select>
  </label>
  <label class="search"><span data-t="search">Search</span><input type="search" id="q" data-t-ph="searchPh" placeholder="prompts, replies, commands, paths, errors…"></label>
  <!-- the filters that narrow what the view shows; the button counts the ones set -->
  <details class="hmenu" id="filterMenu">
    <summary><span data-t="filters">Filters</span><span class="hmenu-count" id="filterCount" hidden></span></summary>
    <div class="hmenu-box panel">
      <label id="groupFilter" data-t-title="groupTitle" title="Which part of the map: Files, Shell, Git, MCP…"><span data-t="group">Tool group</span><select id="station"></select></label>
      <label id="agentFilter" style="display:none" data-t-title="agentTitle" title="Show sessions from one agent, or from all of them"><span data-t="agent">Agent</span>
        <select id="agent"><option value="" data-t="allAgents">all agents</option><option value="claude">Claude Code</option><option value="codex">Codex</option><option value="pi">pi</option><option value="omp">omp</option></select>
      </label>
      <label class="check" id="problemsFilter"><input type="checkbox" id="problems"> <span data-t="onlyProblems">only problems</span></label>
      <hr>
      <button id="clearFilters" data-t="resetFilters">Reset filters</button>
    </div>
  </details>
</section>

<section class="panels" id="panels">
  <aside class="panel" id="sessions"></aside>
  <main class="panel stage" id="center">
    <div class="layouts" id="layouts" role="tablist" aria-label="View" data-t-aria="view"></div>
    <div class="map-wrap"><div id="mid"></div><div id="alt"></div></div>
    <div class="cats" id="cats"></div>
  </main>
  <div class="dwrap" id="detailWrap">
    <div class="dsplit" id="detailSplit" role="separator" aria-orientation="vertical" tabindex="0" data-t-title="detailResizeTitle" data-t-aria="detailResize"></div>
    <button class="drail" id="detailShow" data-t-title="detailShowTitle"><span>«</span> <span data-t="details">Details</span></button>
    <aside class="panel" id="detail"></aside>
  </div>
</section>

<dialog id="shortcuts" class="panel"></dialog>

<!-- Plain scripts sharing one global scope (no modules, no build). Order matters: a file uses names from the ones above it.
     building-blocks/ know nothing about the features; features/<feature>/ are grouped by function (model, render, controls);
     app/ is the page around them and starts everything. -->
<script src="dashboard/building-blocks/language/i18n.js"></script>

<script>
// Nothing loaded: the server on this port was started before the dashboard was split into files, and can't serve them.
if (typeof boot !== 'function') {
  document.body.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;max-width:60ch;margin:48px auto;padding:0 24px">' +
    '<b>Session Observer could not load its files.</b><br>The server on this port is older than this page. Stop it and start it again: <code>node server/server.js</code></p>';
}

</html>
