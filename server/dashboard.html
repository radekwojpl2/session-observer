<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Observer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f4; --line: #dcdfe5; --line-2: #e8eaee;
    --text: #1b1d22; --muted: #646b78; --faint: #9aa0ab; --accent: #2563eb; --accent-bg: #dbe7ff;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626; --err-bg: #fde4e4; --spoke: #b9bec8;
    --s-you: #0d9488; --s-model: #7c3aed; --s-files: #2563eb; --s-shell: #475569; --s-git: #db2777; --s-mcp: #ea580c;
    --s-network: #4f46e5; --s-browser: #059669; --s-agents: #b45309; --s-skills: #65a30d; --s-context: #0891b2; --s-other: #6b7280;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f11; --panel: #17181b; --panel-2: #1f2125; --line: #2d3036; --line-2: #24262b;
      --text: #e6e7ea; --muted: #9a9fa9; --faint: #6b707a; --accent: #3b82f6; --accent-bg: #1c2d4d;
      --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --err-bg: #3a1618; --spoke: #3a3e46;
      --s-you: #2dd4bf; --s-model: #a78bfa; --s-files: #60a5fa; --s-shell: #cbd5e1; --s-git: #f472b6; --s-mcp: #fb923c;
      --s-network: #818cf8; --s-browser: #34d399; --s-agents: #fbbf24; --s-skills: #a3e635; --s-context: #22d3ee; --s-other: #9ca3af;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f11; --panel: #17181b; --panel-2: #1f2125; --line: #2d3036; --line-2: #24262b;
    --text: #e6e7ea; --muted: #9a9fa9; --faint: #6b707a; --accent: #3b82f6; --accent-bg: #1c2d4d;
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --err-bg: #3a1618; --spoke: #3a3e46;
    --s-you: #2dd4bf; --s-model: #a78bfa; --s-files: #60a5fa; --s-shell: #cbd5e1; --s-git: #f472b6; --s-mcp: #fb923c;
    --s-network: #818cf8; --s-browser: #34d399; --s-agents: #fbbf24; --s-skills: #a3e635; --s-context: #22d3ee; --s-other: #9ca3af;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 0 10px 10px; }
  button, select, input { font: inherit; color: var(--text); }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--ok); color: var(--ok); }
  select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .muted { color: var(--muted); } .mono { font-family: var(--mono); } .err { color: var(--err); }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 4px; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .topbar .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex-shrink: 0; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--ok); animation: blink 1.2s infinite; } .dot.bad { background: var(--err); }
  @keyframes blink { 50% { opacity: .35; } }

  /* filter bar */
  .filters { display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 10px; align-items: end; padding: 10px 14px; margin-bottom: 10px; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .filters label > * { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .filters .check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; text-transform: none; font-size: 13px; color: var(--text); letter-spacing: 0; }

  /* stage: hub map + feed + replay */
  .stage { padding: 10px 14px 12px; margin-bottom: 10px; }
  .stage-grid { display: grid; grid-template-columns: minmax(0, 700px) minmax(0, 1fr); gap: 18px; height: 440px; }
  #map { width: 100%; height: 100%; display: block; user-select: none; }
  #map .spoke { stroke: var(--spoke); stroke-linecap: round; transition: stroke-width .4s; }
  #map .st { cursor: pointer; }
  #map .st .node { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
  #map .st.used .node { stroke: currentColor; stroke-opacity: .55; }
  #map .st.sel .node { stroke-width: 3; stroke-opacity: 1; }
  #map .st.hot .node { fill: var(--panel-2); stroke-opacity: 1; }
  #map .st .ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #map .st:not(.used) .ico { opacity: .45; }
  #map .lbl { fill: var(--text); font-size: 13px; text-anchor: middle; }
  #map .cnt { fill: var(--muted); font-size: 11.5px; }
  #map .core { fill: var(--panel); stroke: var(--text); stroke-opacity: .7; stroke-width: 2; }
  #map .ctx-track { fill: none; stroke: var(--line); stroke-width: 5; }
  #map .deco { fill: none; stroke: var(--line); stroke-width: 9; stroke-dasharray: 2 5; transform-box: fill-box; transform-origin: center; }
  #map .deco.spin { animation: spin 14s linear infinite; stroke: var(--spoke); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #map .core-t { fill: var(--text); font-weight: 700; font-size: 13px; text-anchor: middle; letter-spacing: .05em; }
  #map .core-s { fill: var(--muted); font-size: 11px; text-anchor: middle; }
  #map .xn { font-size: 11px; font-weight: 700; text-anchor: middle; }

  .feed-wrap { display: flex; flex-direction: column; min-height: 0; }
  .feed-head { padding: 2px 0 8px; }
  .feed-head .last { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); white-space: nowrap; }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--muted); }
  .chip.sel { border-color: var(--accent); background: var(--accent-bg); }
  .chip .x { color: var(--err); font-weight: 600; }
  #feed { overflow-y: auto; flex: 1; min-height: 0; font-size: 12.5px; }
  .frow { display: grid; grid-template-columns: 14px 86px 104px minmax(0, 1fr); gap: 8px; padding: 4px 4px; border-radius: 4px; cursor: pointer; align-items: baseline; }
  .frow:hover { background: var(--panel-2); }
  .frow .mk { color: var(--faint); text-align: center; }
  .frow .mk.run { color: var(--ok); } .frow .mk.fail { color: var(--err); } .frow .mk.model { color: var(--s-model); }
  .frow .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .frow .who { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
  .frow .what { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .what .proj { color: var(--faint); font-family: inherit; margin-right: 6px; }
  .frow.fail .what { color: var(--err); }
  .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }

  .cats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0 8px; border-top: 1px solid var(--line-2); margin-top: 8px; }
  .cats .ttl { font-weight: 600; margin-right: 4px; display: inline-flex; gap: 5px; align-items: center; }
  .cats .chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .replay { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 340px) auto auto; gap: 10px; align-items: center; }
  #track { position: relative; height: 34px; cursor: pointer; touch-action: none; }
  #track .rail { position: absolute; left: 0; right: 0; bottom: 6px; height: 4px; background: var(--line); border-radius: 2px; }
  #track .fill { position: absolute; left: 0; bottom: 6px; height: 4px; background: var(--accent); border-radius: 2px; }
  #track .thumb { position: absolute; bottom: 1px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  #track .tick { position: absolute; bottom: 13px; width: 5px; margin-left: -2px; background: var(--faint); border-radius: 1px; opacity: .8; }
  #track .tick.err { background: var(--err); }
  #track .tick.cur { background: var(--accent); opacity: 1; }
  #rlabel { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rlabel b { color: var(--text); font-weight: 600; }

  /* bottom three panels */
  .bottom { display: grid; grid-template-columns: 330px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; height: max(560px, calc(100vh - 40px)); }
  .bottom > .panel { overflow-y: auto; min-height: 0; }
  #sessions { padding: 10px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; margin-bottom: 4px; }
  .card:hover { background: var(--panel-2); }
  .card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .name { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card .chips { margin-top: 6px; }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .sect { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 12px 4px 8px; }
  .sect span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .sess-list .card { border-color: transparent; border-bottom: 1px solid var(--line-2); border-radius: 6px; }
  .sess-list .card.sel { border-color: var(--accent); }

  #mid, #detail { padding: 16px 18px; }
  #mid h2, #detail h2 { margin: 0 0 4px; font-size: 18px; }
  #detail h2 { font-size: 15px; }
  .lead { color: var(--muted); margin: 0 0 14px; word-break: break-word; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .tile .l { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 11px; color: var(--muted); }
  .tile.bad .v { color: var(--err); }
  .box { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
  .box > .bh { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .box > .bh span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .box > .bh .grow { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  td .sub { color: var(--muted); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

  .turn { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line-2); cursor: pointer; border-radius: 6px; }
  .turn:hover { background: var(--panel-2); }
  .turn.sel { background: var(--accent-bg); }
  .turn.cur { box-shadow: inset 3px 0 0 var(--accent); }
  .turn .p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .turn .m { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .turn .st-mini { display: inline-flex; align-items: center; gap: 2px; }
  .turn .tm { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  .turn .mk { padding-top: 4px; }

  .dh { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); margin-bottom: 12px; }
  details.key { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
  details.key summary { cursor: pointer; font-weight: 500; }
  .keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 10px; font-size: 12.5px; }
  .keygrid div { display: flex; align-items: center; gap: 6px; }
  .q { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; max-height: 260px; overflow: auto; }
  .q.ans { border-left: 3px solid var(--s-model); }
  .lbl2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .erow { border-bottom: 1px solid var(--line-2); }
  .erow .frow { grid-template-columns: 14px 86px 104px minmax(0, 1fr) auto; }
  .erow .dur { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .erow.hit .frow { background: var(--accent-bg); }
  .erow.open .frow { background: var(--panel-2); }
  pre.raw { margin: 4px 0 10px 22px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; }

  @media (max-width: 1200px) {
    .stage-grid { grid-template-columns: 1fr; height: auto; }
    #map { height: 400px; } #feed { max-height: 360px; }
    .bottom { grid-template-columns: 280px minmax(0, 1fr); height: auto; }
    .bottom > .panel { max-height: 80vh; }
    #detail { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    body { padding: 0 8px 8px; }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .search { grid-column: 1 / -1; }
    .replay { grid-template-columns: auto minmax(0, 1fr) auto; }
    #rlabel, #speed { display: none; }
    .bottom { grid-template-columns: 1fr; }
    #map { height: 300px; }
    .frow { grid-template-columns: 14px 70px minmax(0, 1fr); } .frow .who span { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>Session Observer</h1>
  <span class="pill" title="Live connection to the local server"><span class="dot" id="conn"></span><span id="connTxt">connecting…</span></span>
  <span class="grow"></span>
  <span class="pill" id="hdrBusy"></span>
  <span class="pill" id="hdrCtx"></span>
  <span class="pill" id="updated"></span>
  <button id="pause" title="Stop applying live updates">Pause</button>
  <button id="theme">Theme: auto</button>
  <button id="clearLog" title="Delete the local event log">Clear log</button>
</header>

<section class="panel filters">
  <label>Range
    <select id="range">
      <option value="3600000">last 1 h</option>
      <option value="21600000">last 6 h</option>
      <option value="86400000">last 24 h</option>
      <option value="604800000">last 7 d</option>
      <option value="0">everything</option>
    </select>
  </label>
  <label class="search">Search<input type="search" id="q" placeholder="prompts, replies, commands, paths, errors…"></label>
  <label>Station<select id="station"></select></label>
  <label>Category<select id="category"></select></label>
  <label class="check"><input type="checkbox" id="problems"> only problems</label>
  <button id="clearFilters" style="margin-bottom:1px">Clear</button>
</section>

<section class="panel stage">
  <div class="stage-grid">
    <svg id="map" viewBox="0 0 660 440" preserveAspectRatio="xMidYMid meet" aria-label="Live hub map of the session"></svg>
    <div class="feed-wrap">
      <div class="feed-head">
        <div class="last" id="feedLast"></div>
        <div class="chips" id="feedChips"></div>
      </div>
      <div id="feed"></div>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="replay">
    <button id="play">▶ Replay</button>
    <div id="track"><div class="rail"></div><div id="ticks"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
    <div id="rlabel"></div>
    <select id="speed" title="Replay speed">
      <option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option><option value="25">×25</option>
    </select>
    <button id="live" class="on">Live</button>
  </div>
</section>

<section class="bottom">
  <aside class="panel" id="sessions"></aside>
  <main class="panel" id="mid"></main>
  <aside class="panel" id="detail"></aside>
</section>

<script>
'use strict';
// ---------------------------------------------------------------- constants
const ICONS = {
  you: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
  model: '<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  files: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  shell: '<path d="M5 7l5 5-5 5M12 18h7"/>',
  git: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-5 5-11 8.5"/>',
  mcp: '<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/>',
  network: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18"/>',
  browser: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/>',
  agents: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1M9 17h6"/>',
  skills: '<path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
  context: '<path d="M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5"/>',
  other: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  core: '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>',
  turn: '<path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/>',
};
const STATIONS = [
  ['you', 'You'], ['model', 'Model'], ['files', 'Files'], ['shell', 'Shell'], ['git', 'Git'], ['mcp', 'MCP'],
  ['network', 'Network'], ['browser', 'Browser'], ['agents', 'Agents'], ['skills', 'Skills'], ['context', 'Context'], ['other', 'Other'],
].map(([id, label], i) => ({ id, label, angle: (-90 + i * 30) * Math.PI / 180 }));
const CX = 330, CY = 212, RX = 238, RY = 158;
for (const s of STATIONS) { s.x = CX + RX * Math.cos(s.angle); s.y = CY + RY * Math.sin(s.angle); }
const ST = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const CATS = {
  model: 'Model', prompt: 'Prompt', tool: 'Tool', skill: 'Skill', question: 'Question', subagent: 'Subagent',
  task: 'Task', mcp: 'MCP', permission: 'Permission', error: 'Error', notification: 'Notice',
  compact: 'Compact', context: 'Context', lifecycle: 'Lifecycle', env: 'Env',

  return true;
}
function insertEvent(ev) {
  const a = state.events; let i = a.length;
  while (i > 0 && (a[i - 1].ts > ev.ts || (a[i - 1].ts === ev.ts && a[i - 1].seq > ev.seq))) i--;
  a.splice(i, 0, ev);
  if (a.length > 12000) a.splice(0, a.length - 12000);
  return i === a.length - 1;
}
function takeEvent(ev) {
  const atEnd = insertEvent(ev);
  if (state.cursor == null) {
    if (atEnd) applyEvent(ev, true); else rebuildMap(); // late model step: rebuild silently
    if (!atEnd && ev.event === 'ModelStep') pulse('model', 'both');
  }
  schedule('turns', 'feed', 'cats', 'mid', 'replay', 'map');
  if (state.turnSel && ev.session_id === state.turnSel.split(':')[0]) schedule('detail');
}
function flushBuffer() { const b = state.buffer; state.buffer = []; for (const ev of b) takeEvent(ev); schedule('header'); }

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { state.connected = true; schedule('header'); };
  es.onerror = () => { state.connected = false; schedule('header'); };
  es.addEventListener('session', m => {
    const s = JSON.parse(m.data); state.sessions.set(s.id, s); state.updated = Date.now();
    if (state.paused) return schedule('header');
    schedule('sessions', 'header', 'mid');
  });
  es.addEventListener('event', m => {
    const ev = JSON.parse(m.data); state.updated = Date.now();
    if (!inScope(ev)) return;
    if (state.paused) { state.buffer.push(ev); return schedule('header'); }
    takeEvent(ev);
  });
  es.addEventListener('reset', () => { state.sessions.clear(); state.events = []; state.turnSel = null; state.scope = 'all'; TURNS = []; rebuildMap(); schedule(...ALL); });
}

// ---------------------------------------------------------------- wiring
function applyTheme() {
  const r = document.documentElement;
  if (state.theme === 'auto') delete r.dataset.theme; else r.dataset.theme = state.theme;
  $('theme').textContent = 'Theme: ' + state.theme;
}
function initControls() {
  $('station').innerHTML = '<option value="">all stations</option>' + STATIONS.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
  $('category').innerHTML = '<option value="">any category</option>' + Object.entries(CATS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  $('range').value = String(state.range); if (!$('range').value) { $('range').value = '86400000'; state.range = 86400000; }
  $('speed').value = String(state.speed); if (!$('speed').value) { $('speed').value = '5'; state.speed = 5; }
  applyTheme();

  const refilter = () => schedule('feed', 'mid', 'detail', 'sessions', 'cats', 'map');
  let qt; $('q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); refilter(); }, 150); };
  $('station').onchange = e => { state.station = e.target.value; refilter(); };
  $('category').onchange = e => { state.category = e.target.value; refilter(); };
  $('problems').onchange = e => { state.problems = e.target.checked; refilter(); };
  $('clearFilters').onclick = () => {
    state.q = state.station = state.category = ''; state.problems = false;
    $('q').value = ''; $('station').value = ''; $('category').value = ''; $('problems').checked = false; refilter();
  };
  $('range').onchange = e => { state.range = Number(e.target.value); ls.set('so.range', state.range); loadScope(); };
  $('speed').onchange = e => { state.speed = Number(e.target.value); ls.set('so.speed', state.speed); };
  $('theme').onclick = () => { state.theme = { auto: 'dark', dark: 'light', light: 'auto' }[state.theme] || 'auto'; ls.set('so.theme', state.theme); applyTheme(); };
  $('pause').onclick = () => { state.paused = !state.paused; if (!state.paused) { flushBuffer(); schedule('sessions', 'mid'); } schedule('header'); };
  $('clearLog').onclick = async () => { if (!confirm('Delete all recorded events?')) return; await fetch('/api/clear', { method: 'POST' }); };
  $('play').onclick = () => { if (state.playing) { state.playing = false; renderReplay(); } else startReplay(); };
  $('live').onclick = () => goLive();

  const tr = $('track'); let drag = false;
  tr.addEventListener('pointerdown', e => { drag = true; tr.setPointerCapture(e.pointerId); trackSeek(e.clientX); });
  tr.addEventListener('pointermove', e => { if (drag) trackSeek(e.clientX); });
  tr.addEventListener('pointerup', () => { drag = false; });

  $('map').addEventListener('click', e => {
    const g = e.target.closest('.st'); if (!g) return;
    state.station = state.station === g.dataset.st ? '' : g.dataset.st; $('station').value = state.station; refilter();
  });
  $('cats').onclick = e => {
    const c = e.target.closest('[data-cat]'); if (!c) return;
    state.category = state.category === c.dataset.cat ? '' : c.dataset.cat; $('category').value = state.category; refilter();
  };
  $('feed').onclick = e => {
    const r = e.target.closest('.frow'); if (!r) return;
    const seq = Number(r.dataset.seq); const t = TURN_BY_SEQ.get(seq);
    if (t) selectTurn(t.key, seq);
  };
  $('sessions').onclick = e => { const c = e.target.closest('.card'); if (c) selectScope(c.dataset.id); };
  $('mid').onclick = e => {
    if (e.target.closest('#toggleRunning')) { state.showRunning = !state.showRunning; return renderMid(); }
    const row = e.target.closest('tr[data-id]'); if (row) return selectScope(row.dataset.id);
    const t = e.target.closest('.turn'); if (t) selectTurn(t.dataset.key);
  };
  $('detail').onclick = e => {
    if (e.target.closest('#closeTurn')) { state.turnSel = null; renderDetail(); renderMid(); return; }
    if (e.target.closest('#prevTurn')) return stepTurn(-1);
    if (e.target.closest('#nextTurn')) return stepTurn(1);
    if (e.target.closest('pre.raw')) return;
    const r = e.target.closest('.erow'); if (!r) return;
    const seq = Number(r.id.slice(3)); state.evOpen.has(seq) ? state.evOpen.delete(seq) : state.evOpen.add(seq); renderDetail();
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === 'Escape') { state.turnSel = null; renderDetail(); renderMid(); }
    else if (e.key === '[') stepTurn(-1);
    else if (e.key === ']') stepTurn(1);
  });
  setInterval(() => { if (!state.paused) schedule('header', 'sessions', 'mid'); }, 15000); // refresh "ago" labels
}

async function boot() {
  buildMap(); initControls();
  try { const list = await (await fetch('/api/sessions')).json(); state.sessions = new Map(list.map(s => [s.id, s])); } catch { /* server down */ }
  const m = location.hash.match(/session=([^&]+)/);
  if (m && state.sessions.has(decodeURIComponent(m[1]))) state.scope = decodeURIComponent(m[1]);
  await loadScope();
  connect();
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
