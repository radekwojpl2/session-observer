name: Deploy site

# Publishes the static landing page in public_html/ to GitHub Pages. Only the contents of public_html/ are
# published (index.html and assets/), so nothing else from the repository goes online.
# Pages must use "GitHub Actions" as its source (Settings → Pages → Build and deployment).
# For a custom domain, set it in Settings → Pages; GitHub then serves the site there with HTTPS.
on:
  push:
    branches: [main]
    paths:
      - 'public_html/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish public_html to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the site
      id-token: write   # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public_html
      - id: deployment
        uses: actions/deploy-pages@v5
