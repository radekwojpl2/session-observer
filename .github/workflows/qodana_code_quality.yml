name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Qodana may push quick-fixes or a baseline
      pull-requests: write   # PR summary comment
      checks: write          # inline annotations
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR commit, not the merge commit
          fetch-depth: 0                                    # full history, needed for PR mode
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests with coverage
        run: |
          mkdir -p .qodana/code-coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=.qodana/code-coverage/lcov.info \
            test/*.test.js
      - name: Qodana scan
        uses: JetBrains/qodana-action@aa698739cd4b8204ad53291bea7e16cd75da3c9f # v2026.3.1
        with:
          pr-mode: true   # on a pull request, report only what it changed
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1914159553 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
