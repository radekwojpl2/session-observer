# Qodana config. Do not store secrets here: this file is included in the Qodana report.
version: "1.0"
linter: qodana-js
profile:
  name: qodana.recommended
include:
  - name: CssMissingSemicolon
  - name: CssRedundantUnit
  - name: CssInvalidCustomPropertyAtRuleDeclaration
  - name: CssInvalidCustomPropertyAtRuleName
  - name: CssInvalidFunction
  - name: CssInvalidMediaFeature
  - name: CssInvalidPropertyValue
  - name: CssInvalidPseudoSelector
  - name: CssInvalidHtmlTagReference
  - name: CssInvalidImport
  - name: CssInvalidCharsetRule
  - name: CssNegativeValue
  - name: CssInvalidAtRule
  - name: CssUnknownProperty
  - name: CssUnknownUnit
  - name: CssUnresolvedClassInComposesRule
  - name: CssUnresolvedCustomProperty
  - name: CssUnknownTarget
  - name: CssMissingComma
  - name: CssNoGenericFontName
  - name: CssNonIntegerLengthInPixels
  - name: CssConvertColorToHexInspection
  - name: CssConvertColorToRgbInspection
  - name: CssDeprecatedValue
  - name: CssOverwrittenProperties
  - name: CssReplaceWithShorthandSafely
  - name: CssReplaceWithShorthandUnsafely
  - name: CssBrowserCompatibilityForProperties
  - name: CssUnusedSymbol
  - name: HtmlFormInputWithoutLabel
  - name: HtmlRequiredAltAttribute
  - name: HtmlRequiredLangAttribute
  - name: HtmlRequiredSummaryAttribute
  - name: HtmlRequiredTitleAttribute
  - name: HtmlRequiredTitleElement
  - name: CheckEmptyScriptTag
  - name: HtmlUnknownBooleanAttribute
  - name: CheckValidXmlInScriptTagBody
  - name: CheckImageSize
  - name: HtmlMissingClosingTag
  - name: RequiredAttributes
  - name: HtmlDeprecatedAttribute
  - name: HtmlDeprecatedTag
  - name: HtmlPresentationalElement
  - name: HtmlExtraClosingTag
  - name: HtmlUnknownAttribute
  - name: HtmlUnknownTag
  - name: HtmlUnknownTarget
  - name: HtmlUnknownAnchorTarget
  - name: HtmlNonExistentInternetResource
  - name: HtmlWrongAttributeValue
  - name: CyclomaticComplexityInspection
  - name: ShellCheck
  - name: IgnoreFileDuplicateEntry
  - name: EditorConfigDeprecatedDescriptor
  - name: EditorConfigCharClassLetterRedundancy
  - name: EditorConfigPatternRedundancy
  - name: EditorConfigHeaderUniqueness
  - name: EditorConfigEmptyHeader
  - name: EditorConfigEmptySection
  - name: EditorConfigRootDeclarationUniqueness
  - name: EditorConfigEncoding
  - name: EditorConfigVerifyByCore
  - name: EditorConfigValueCorrectness
  - name: EditorConfigReferenceCorrectness
  - name: EditorConfigNoMatchingFiles
  - name: EditorConfigValueUniqueness
  - name: EditorConfigPartialOverride
  - name: EditorConfigShadowedOption
  - name: EditorConfigShadowingOption
  - name: EditorConfigOptionRedundancy
  - name: EditorConfigWildcardRedundancy
  - name: EditorConfigMissingRequiredDeclaration
  - name: EditorConfigSpaceInHeader
  - name: EditorConfigNumerousWildcards
  - name: EditorConfigUnexpectedComma
  - name: EditorConfigPairAcceptability
  - name: EditorConfigRootDeclarationCorrectness
  - name: EditorConfigListAcceptability
  - name: EditorConfigKeyCorrectness
  - name: EditorConfigPatternEnumerationRedundancy
  - name: EditorConfigCharClassRedundancy
  - name: EditorConfigUnusedDeclaration
  - name: GrazieInspection
  - name: GrazieInspectionRunner
  - name: LanguageDetectionInspection
  - name: SpellCheckingInspection
  - name: GrazieStyle
  - name: RegExpAnonymousGroup
  - name: RegExpEscapedMetaCharacter
  - name: RegExpOctalEscape
coverage:
  codeCoverageLocations:
    - ".qodana/code-coverage"
